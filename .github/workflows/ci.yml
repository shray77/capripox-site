name: capripox-gate

# Гейт витрины: математика ядра EFSA и данные статьи обязаны держать
# известные ответы. Наследие Task 174 («гейты не вызывались ни одним CI») —
# здесь гейт в CI с первого дня.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  known-answers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Известные ответы + референс данных + матрица стратегий
        run: node --test tests/capripox.test.mjs
